services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobfit_app
      POSTGRES_PASSWORD: "${JOBFIT_DB_PASSWORD:?JOBFIT_DB_PASSWORD is required}"
      POSTGRES_DB: jobfit_prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U jobfit_app -d jobfit_prod
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  jobfit-agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: "postgresql+asyncpg://jobfit_app:${JOBFIT_DB_PASSWORD:?JOBFIT_DB_PASSWORD is required}@postgres:5432/jobfit_prod"
      REDIS_URL: redis://redis:6379/0
      VECTOR_INDEX_PATH: /app/.cache/chroma
      EMBEDDING_CACHE_PATH: /app/.cache/fastembed
      ALLOW_DEMO_TOKEN: "false"
      RATE_LIMIT_ENABLED: "true"
      LOG_FORMAT: json
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_prod_data:/app/.cache/chroma
      - fastembed_prod_data:/app/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        python scripts/check_deployment_config.py
        && alembic upgrade head
        && python scripts/setup_langgraph_checkpoint.py
        && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready')
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_prod_data:
  redis_prod_data:
  chroma_prod_data:
  fastembed_prod_data:
