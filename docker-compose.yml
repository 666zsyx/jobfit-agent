services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobfit_app
      POSTGRES_PASSWORD: ${JOBFIT_DB_PASSWORD:-jobfit_dev_password}
      POSTGRES_DB: jobfit_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U jobfit_app -d jobfit_dev
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  jobfit-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobfit-agent
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      DATABASE_URL: "postgresql+asyncpg://jobfit_app:${JOBFIT_DB_PASSWORD:-jobfit_dev_password}@postgres:5432/jobfit_dev"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
